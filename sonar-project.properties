# One project covers both services, the console and the existing infrastructure.
sonar.projectKey=Joaomagh_credpay
sonar.organization=joaomagh
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/target/**,**/node_modules/**,frontend/dist/**,frontend/coverage/**,frontend/.angular/**,.local/**,output/**
sonar.test.inclusions=**/src/test/**,frontend/**/*.spec.ts,frontend/e2e/**,frontend/tests/**,infra/**/test_*.py,infra/**/check-*.ps1,config/**/check-*.ps1
sonar.java.source=21
sonar.java.binaries=transacoes-service/target/classes,processamento-service/target/classes
sonar.java.test.binaries=transacoes-service/target/test-classes,processamento-service/target/test-classes
sonar.java.libraries=transacoes-service/target/sonar-dependencies/*.jar,processamento-service/target/sonar-dependencies/*.jar
sonar.java.test.libraries=transacoes-service/target/sonar-dependencies/*.jar,processamento-service/target/sonar-dependencies/*.jar
sonar.coverage.jacoco.xmlReportPaths=transacoes-service/target/site/jacoco/jacoco.xml,processamento-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/console/lcov-sonar.info,frontend/coverage/edge/lcov-sonar.info
sonar.python.coverage.reportPaths=.local/sonar-python/coverage.xml
sonar.coverageReportPaths=.local/sonar-powershell/sonar-coverage.xml
