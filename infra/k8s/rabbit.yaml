apiVersion: v1
kind: Service
metadata:
  name: rabbit
spec:
  clusterIP: None
  selector:
    app: rabbit
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbit
spec:
  serviceName: rabbit
  replicas: 1
  selector:
    matchLabels:
      app: rabbit
  template:
    metadata:
      labels:
        app: rabbit
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbit
          image: rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          env:
            - name: RABBITMQ_NODENAME
              value: rabbit@rabbit-0
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: credpay-demo, key: rabbit-user}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: credpay-demo, key: rabbit-password}
          ports:
            - containerPort: 5672
          startupProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
