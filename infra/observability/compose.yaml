services:
  transacoes:
    networks: [default, observability]
  processamento:
    networks: [default, observability]

  prometheus:
    image: ${PROMETHEUS_IMAGE:?use infra/observability/images.env}
    platform: linux/amd64
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:9090/-/ready]
      interval: 3s
      timeout: 3s
      retries: 30

  grafana:
    image: ${GRAFANA_IMAGE:?use infra/observability/images.env}
    platform: linux/amd64
    user: "472:472"
    environment:
      # Credenciais públicas fictícias: somente demo local/CI descartável.
      GF_SECURITY_ADMIN_USER: credpay_demo
      GF_SECURITY_ADMIN_PASSWORD: demo_grafana_only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_ON_STARTUP: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - ./../observability/datasources.yml:/etc/grafana/provisioning/datasources/credpay.yml:ro
      - ./../observability/dashboards.yml:/etc/grafana/provisioning/dashboards/credpay.yml:ro
      - ./../observability/publication-dashboard.json:/etc/grafana/dashboards/publication.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3000}:3000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3000/api/health]
      interval: 3s
      timeout: 3s
      retries: 30

networks:
  observability:
    internal: true

volumes:
  prometheus-data:
  grafana-data:
