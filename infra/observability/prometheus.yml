global:
  scrape_interval: 2s
  scrape_timeout: 1s
# Coleta interna opt-in dos exportadores existentes.
scrape_configs:
  - job_name: credpay-transacoes
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['transacoes:8080']
  - job_name: credpay-processamento
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['processamento:8080']
