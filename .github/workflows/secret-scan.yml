name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan reachable Git history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Check out full history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified scanner in runner temporary directory
        shell: bash
        run: |
          directory="$RUNNER_TEMP/credpay-gitleaks"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$directory/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$directory/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
          test "$("$directory/gitleaks" version)" = "$GITLEAKS_VERSION"

      - name: Prove detector rejects a synthetic pattern
        shell: bash
        run: |
          probe=$(mktemp -d "$RUNNER_TEMP/credpay-secret-canary.XXXXXX")
          printf 'aws_access_key_id=AKIA%s\n' 'B3C4D5E6F7G2H3J4' > "$probe/canary.txt"
          set +e
          "$RUNNER_TEMP/credpay-gitleaks/gitleaks" dir --redact=100 --no-banner \
            --log-level error --ignore-gitleaks-allow --exit-code=42 "$probe"
          result=$?
          set -e
          test "$result" -eq 42

      - name: Scan reachable history with redacted diagnostics
        shell: bash
        run: |
          "$RUNNER_TEMP/credpay-gitleaks/gitleaks" git --redact=100 --no-banner \
            --log-level error --ignore-gitleaks-allow --log-opts="--all" .
