name: Frontend Angular

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/frontend/BASELINE.md'
      - 'docs/frontend/dependencies-baseline.json'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test, build and audit Angular
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - name: Check out sources without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Node runtime in temporary directory
        shell: bash
        run: |
          directory="$RUNNER_TEMP/credpay-frontend-node"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 \
            https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz \
            --output "$directory/node.tar.xz"
          printf '%s  %s\n' 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6 \
            "$directory/node.tar.xz" | sha256sum --check --status
          tar -xJf "$directory/node.tar.xz" -C "$directory"
          echo "$directory/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"
          touch "$RUNNER_TEMP/frontend-user.npmrc" "$RUNNER_TEMP/frontend-global.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/frontend-user.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/frontend-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/frontend-npm-cache" >> "$GITHUB_ENV"

      - name: Resolve exactly the lockfile without install scripts
        run: |
          test "$(node --version)" = v24.22.1
          npm ci --ignore-scripts --no-fund

      - name: Check types and behavior
        run: |
          npm run check
          npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit all resolved packages
        run: npm audit --audit-level=low
