name: CredPay Compose CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "transacoes-service/**"
      - "processamento-service/**"
      - "infra/compose/**"
      - "infra/rabbitmq/**"
      - "infra/images/**"
      - "frontend/**"
      - ".github/workflows/credpay-compose-ci.yml"
  push:
    branches: [main]
    paths:
      - "transacoes-service/**"
      - "processamento-service/**"
      - "infra/compose/**"
      - "infra/rabbitmq/**"
      - "infra/images/**"
      - "frontend/**"
      - ".github/workflows/credpay-compose-ci.yml"

permissions:
  contents: read

concurrency:
  group: credpay-compose-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-controls:
    name: Diagnostic controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline refusal, ownership and lifecycle
        shell: pwsh
        run: |
          ./infra/compose/check-diagnostic-fault.ps1
          ./infra/compose/check-diagnostic-local.ps1
          ./infra/compose/check-diagnostic-lifecycle.ps1
          ./infra/compose/check-diagnostic-process.ps1
          ./infra/compose/check-smoke-refusal.ps1
  compose:
    name: Prepare, activate and preserve local data
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: diagnostic-controls
    env:
      CREDPAY_IMAGE_TAG: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: credpay-ci-${{ github.run_id }}-${{ github.run_attempt }}
      NG_CLI_ANALYTICS: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted repository code can access this credential during the job.
      - name: Check public pull authentication availability
        id: dockerhub_auth
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          CREDPAY_DOCKERHUB_USERNAME: ${{ secrets.CREDPAY_DOCKERHUB_USERNAME }}
          CREDPAY_DOCKERHUB_TOKEN: ${{ secrets.CREDPAY_DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$CREDPAY_DOCKERHUB_USERNAME" ] && [ -n "$CREDPAY_DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub authentication unavailable; public pulls and tests remain enabled."
          fi
      - name: Authenticate public image pulls
        if: ${{ steps.dockerhub_auth.outputs.available == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.CREDPAY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CREDPAY_DOCKERHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            transacoes-service/pom.xml
            processamento-service/pom.xml
      - name: Record available tools and validate configuration
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          docker compose version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml config --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml -f infra/compose/compose.diagnostics.yaml config --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./infra/compose/check-json.ps1
          ./infra/compose/check-metrics.ps1
      - name: Make Maven Wrappers executable
        run: chmod +x transacoes-service/mvnw processamento-service/mvnw
      - name: Package transaction application
        working-directory: transacoes-service
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Package processing application
        working-directory: processamento-service
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Build images for this checkout
        run: docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml build transacoes processamento
      - name: Verify phases, flow and persistence
        shell: pwsh
        run: |
          docker pull postgres@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker pull rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./infra/compose/diagnose.ps1 -Action Run -ImageTag $env:CREDPAY_IMAGE_TAG -TxPort 8080 -ProcPort 8081
      - name: Prepare verified Node runtime for browser tests
        shell: bash
        run: |
          directory="$RUNNER_TEMP/credpay-browser-node"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 \
            https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz \
            --output "$directory/node.tar.xz"
          printf '%s  %s\n' 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6 \
            "$directory/node.tar.xz" | sha256sum --check --status
          tar -xJf "$directory/node.tar.xz" -C "$directory"
          echo "$directory/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"
          touch "$RUNNER_TEMP/browser-user.npmrc" "$RUNNER_TEMP/browser-global.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/browser-user.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/browser-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/browser-npm-cache" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/credpay-browser-binaries" >> "$GITHUB_ENV"
      - name: Install locked browser test tools and headless Chromium
        working-directory: frontend
        run: |
          test "$(node --version)" = v24.22.1
          npm ci --ignore-scripts --no-fund
          npm run check:e2e
          node node_modules/playwright/cli.js install chromium --only-shell
      - name: Exercise desktop and mobile against real applications
        working-directory: frontend
        run: npm run e2e:ci
      - name: Remove only this disposable CI project
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .local/compose-diagnostics/active.json) {
            ./infra/compose/diagnose.ps1 -Action Remove
          }
