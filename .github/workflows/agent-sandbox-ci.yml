name: Sandbox Core CI

on:
  pull_request:
    paths:
      - "infra/agent-sandbox/**"
      - ".github/workflows/agent-sandbox-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/agent-sandbox/**"
      - ".github/workflows/agent-sandbox-ci.yml"

permissions:
  contents: read

concurrency:
  group: sandbox-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify static inventory controls
        run: python3 -I -B -m unittest discover -s infra/agent-sandbox -p 'test_*.py'
      - name: Inventory pinned source without starting container
        run: python3 -I -B infra/agent-sandbox/source_ci.py
      - name: Build reduced core offline and verify exact export and tools
        run: python3 -I -B infra/agent-sandbox/core_ci.py
      - name: Publish selected source metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-source-${{ github.sha }}
          path: |
            .local/agent-sandbox/credpay-source-${{ github.run_id }}-${{ github.run_attempt }}/reports/source-inventory.json
            .local/agent-sandbox/credpay-source-${{ github.run_id }}-${{ github.run_attempt }}/reports/SUMMARY.md
            .local/agent-sandbox/credpay-source-${{ github.run_id }}-${{ github.run_attempt }}/core/reports/core-inventory.json
            .local/agent-sandbox/credpay-source-${{ github.run_id }}-${{ github.run_attempt }}/core/reports/SUMMARY.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
