name: Transaction Service CI

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Manual rehearsal; pull requests and pushes always run the full suite'
        type: choice
        required: true
        default: full
        options:
          - full
          - billing-persistence
          - email-registration
  pull_request:
    paths:
      - "config/checkstyle/**"
      - "transacoes-service/**"
      - "infra/rabbitmq/transacoes-policies.json"
      - "infra/rabbitmq/TRANSACOES.md"
      - ".github/workflows/transacoes-service-ci.yml"
  push:
    branches:
      - main
    paths:
      - "config/checkstyle/**"
      - "transacoes-service/**"
      - "infra/rabbitmq/transacoes-policies.json"
      - "infra/rabbitmq/TRANSACOES.md"
      - ".github/workflows/transacoes-service-ci.yml"

permissions:
  contents: read

concurrency:
  group: transacoes-service-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.test_scope || 'full' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'email-registration' && 'Email registration rehearsal' || github.event_name == 'workflow_dispatch' && inputs.test_scope == 'billing-persistence' && 'Billing persistence rehearsal' || 'Maven verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BILLING_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'billing-persistence' }}
      EMAIL_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'email-registration' }}

    defaults:
      run:
        working-directory: transacoes-service

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trusted repository code can access this credential during the job.
      - name: Check public pull authentication availability
        id: dockerhub_auth
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          CREDPAY_DOCKERHUB_USERNAME: ${{ secrets.CREDPAY_DOCKERHUB_USERNAME }}
          CREDPAY_DOCKERHUB_TOKEN: ${{ secrets.CREDPAY_DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$CREDPAY_DOCKERHUB_USERNAME" ] && [ -n "$CREDPAY_DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub authentication unavailable; public pulls and tests remain enabled."
          fi
      - name: Authenticate public image pulls
        id: dockerhub_login
        continue-on-error: true
        if: ${{ steps.dockerhub_auth.outputs.available == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.CREDPAY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CREDPAY_DOCKERHUB_TOKEN }}
      - name: Fall back to anonymous public image pulls
        if: ${{ steps.dockerhub_login.outcome == 'failure' }}
        run: |
          docker logout >/dev/null 2>&1 || true
          echo 'Docker Hub credential rejected; public image pulls will run anonymously and still must pass.'

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: transacoes-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify Checkstyle controls
        shell: pwsh
        run: ../config/checkstyle/check-controls.ps1 -Module transacoes-service

      - name: Verify transaction service
        run: |
          if [ "$EMAIL_REHEARSAL" = true ]; then
            ./mvnw --batch-mode --no-transfer-progress -Pcoverage -DargLine=-XX:-EnableDynamicAgentLoading '-Dtest=SessaoDemoHttpTest#cadastro*' verify
          elif [ "$BILLING_REHEARSAL" = true ]; then
            ./mvnw --batch-mode --no-transfer-progress -Pcoverage -DargLine=-XX:-EnableDynamicAgentLoading -Dtest=CobrancaPersistenceIntegrationTest verify
          else
            ./mvnw --batch-mode --no-transfer-progress -Pcoverage -DargLine=-XX:-EnableDynamicAgentLoading verify
          fi

      - name: Store transaction coverage
        if: ${{ env.BILLING_REHEARSAL != 'true' && env.EMAIL_REHEARSAL != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-transacoes-service
          path: transacoes-service/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 14
