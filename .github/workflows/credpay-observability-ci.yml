name: CredPay Observability CI

on:
  pull_request:
    paths:
      - "transacoes-service/**"
      - "processamento-service/**"
      - "infra/compose/**"
      - "infra/observability/**"
      - "infra/rabbitmq/**"
      - ".github/workflows/credpay-observability-ci.yml"
  push:
    branches: [main]
    paths:
      - "transacoes-service/**"
      - "processamento-service/**"
      - "infra/compose/**"
      - "infra/observability/**"
      - "infra/rabbitmq/**"
      - ".github/workflows/credpay-observability-ci.yml"

permissions:
  contents: read

concurrency:
  group: credpay-observability-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability:
    name: Collect application metrics in disposable project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CREDPAY_IMAGE_TAG: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: credpay-observe-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted repository code can access this credential during the job.
      - name: Check public pull authentication availability
        id: dockerhub_auth
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          CREDPAY_DOCKERHUB_USERNAME: ${{ secrets.CREDPAY_DOCKERHUB_USERNAME }}
          CREDPAY_DOCKERHUB_TOKEN: ${{ secrets.CREDPAY_DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$CREDPAY_DOCKERHUB_USERNAME" ] && [ -n "$CREDPAY_DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub authentication unavailable; public pulls and tests remain enabled."
          fi
      - name: Authenticate public image pulls
        if: ${{ steps.dockerhub_auth.outputs.available == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.CREDPAY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CREDPAY_DOCKERHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            transacoes-service/pom.xml
            processamento-service/pom.xml
      - name: Record available tools and validate configuration
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          docker compose version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml config --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml -f infra/compose/compose.diagnostics.yaml config --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./infra/compose/check-json.ps1
          ./infra/compose/check-metrics.ps1
          ./infra/observability/check-http.ps1
          docker compose --env-file infra/compose/.env.example --env-file infra/observability/images.env -f infra/compose/compose.yaml -f infra/compose/compose.diagnostics.yaml -f infra/observability/compose.yaml config --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Make Maven Wrappers executable
        run: chmod +x transacoes-service/mvnw processamento-service/mvnw
      - name: Package transaction application
        working-directory: transacoes-service
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Package processing application
        working-directory: processamento-service
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Build images for this checkout
        run: docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml build transacoes processamento
      - name: Verify real collection and dashboard
        shell: pwsh
        run: ./infra/observability/verify.ps1 -Project $env:COMPOSE_PROJECT_NAME
      - name: Remove only this disposable CI project
        if: always()
        shell: pwsh
        run: |
          if ($env:COMPOSE_PROJECT_NAME -cnotmatch '^credpay-observe-ci-[0-9]+-[0-9]+$') { throw 'Invalid CI project' }
          $marker = ".local/observability/$env:COMPOSE_PROJECT_NAME.created"
          if ((Test-Path -LiteralPath $marker) -and [IO.File]::ReadAllText((Join-Path (Get-Location) $marker)) -ceq $env:COMPOSE_PROJECT_NAME) {
            docker compose --project-name $env:COMPOSE_PROJECT_NAME --env-file infra/compose/.env.example --env-file infra/observability/images.env -f infra/compose/compose.yaml -f infra/compose/compose.diagnostics.yaml -f infra/observability/compose.yaml down --volumes --timeout 30
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
