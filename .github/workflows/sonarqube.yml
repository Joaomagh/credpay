name: SonarQube analysis

on:
  pull_request:
    paths:
      - 'infra/quality/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'
  workflow_dispatch:
    inputs:
      analyze:
        description: 'Send the verified checkout to SonarQube (requires SONAR_TOKEN and automatic analysis off)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Verify coverage inputs and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - name: Check analysis authorization and token availability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Remote analysis is limited to main.'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo 'Configure the repository secret SONAR_TOKEN without sharing it in logs.'; exit 1; }

      - name: Check out the complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify coverage mapping controls
        run: |
          python3 -I -B -m unittest discover -s infra/quality -p 'test_*.py'
          echo "SONAR_PYTHON_VERSION=$(python3 -c 'import sys; print(str(sys.version_info.major) + "." + str(sys.version_info.minor))')" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Check public pull authentication availability
        id: dockerhub_auth
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          CREDPAY_DOCKERHUB_USERNAME: ${{ secrets.CREDPAY_DOCKERHUB_USERNAME }}
          CREDPAY_DOCKERHUB_TOKEN: ${{ secrets.CREDPAY_DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$CREDPAY_DOCKERHUB_USERNAME" ] && [ -n "$CREDPAY_DOCKERHUB_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate public image pulls
        if: ${{ steps.dockerhub_auth.outputs.available == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.CREDPAY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CREDPAY_DOCKERHUB_TOKEN }}

      - name: Verify both services and collect their analysis classpaths
        run: |
          for module in transacoes-service processamento-service; do
            chmod +x "$module/mvnw"
            (cd "$module" && ./mvnw --batch-mode --no-transfer-progress -Pcoverage \
              -DargLine=-XX:-EnableDynamicAgentLoading verify \
              org.apache.maven.plugins:maven-dependency-plugin:3.9.0:copy-dependencies \
              -DincludeScope=test -DoutputDirectory=target/sonar-dependencies)
          done

      - name: Install the verified Node runtime
        run: |
          directory="$RUNNER_TEMP/credpay-sonar-node"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 \
            https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz --output "$directory/node.tar.xz"
          printf '%s  %s\n' 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6 \
            "$directory/node.tar.xz" | sha256sum --check --status
          tar -xJf "$directory/node.tar.xz" -C "$directory"
          echo "$directory/node-v24.22.1-linux-x64/bin" >> "$GITHUB_PATH"
          touch "$RUNNER_TEMP/sonar-user.npmrc" "$RUNNER_TEMP/sonar-global.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/sonar-user.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/sonar-global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/sonar-npm-cache" >> "$GITHUB_ENV"

      - name: Verify frontend behavior and coverage
        working-directory: frontend
        run: |
          test "$(node --version)" = v24.22.1
          npm ci --ignore-scripts --no-fund
          npm run check
          npm run test:coverage
          npm run build -- --configuration production,contas
          npm audit --audit-level=low

      - name: Refuse incomplete reports and normalize LCOV sources
        run: python3 -I -B infra/quality/prepare_sonar.py

      - name: Store the three verified coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-${{ github.sha }}
          path: |
            transacoes-service/target/site/jacoco/jacoco.xml
            processamento-service/target/site/jacoco/jacoco.xml
            frontend/coverage/console/lcov-sonar.info
          if-no-files-found: error
          retention-days: 14

      - name: Analyze and wait for the configured quality gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.3.1.16491
          args: >-
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.python.version=${{ env.SONAR_PYTHON_VERSION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
